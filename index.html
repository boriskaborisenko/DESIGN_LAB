<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>HLS Background Video</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&family=Playfair+Display:ital,wght@1,700;1,800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #000;
      font-family: "Inter", Arial, Helvetica, sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 560px;
      overflow: hidden;
      background: #000;
      color: #fff;
    }

    .fallback-image-layer,
    .video-stage,
    .video-layer,
    .video-cover,
    .overlay {
      position: absolute;
      inset: 0;
    }

    .fallback-image-layer {
      z-index: 1;
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      background-color: #111;
    }

    .video-stage {
      z-index: 2;
      overflow: hidden;
      background: #000;
    }

    .video-layer {
      overflow: hidden;
      opacity: 0;
      transition: opacity 1.1s ease;
      will-change: opacity;
    }

    .video-layer.visible {
      opacity: 1;
    }

    .video-layer video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .video-layer video::-webkit-media-controls,
    .video-layer video::-webkit-media-controls-panel,
    .video-layer video::-webkit-media-controls-play-button,
    .video-layer video::-webkit-media-controls-start-playback-button {
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    .video-cover {
      z-index: 3;
      background:
        radial-gradient(circle at center, rgba(255, 255, 255, 0.08), transparent 40%),
        linear-gradient(135deg, #111, #222);
      opacity: 1;
      pointer-events: none;
      transition: opacity 0.9s ease;
    }

    .video-cover.hidden {
      opacity: 0;
    }

    .overlay {
      z-index: 4;
      background: linear-gradient(rgba(0, 0, 0, 0.42), rgba(0, 0, 0, 0.58));
    }

    .content {
      position: relative;
      z-index: 5;
      width: 100%;
      height: 100%;
      padding: 24px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;
    }

    .content h1 {
      width: min(840px, calc(100vw - 64px));
      max-width: 100%;
      margin-bottom: 30px;
      color: rgba(255, 255, 255, 0.94);
      text-align: center;
      opacity: 0;
      transform: translateY(18px);
      animation: contentReveal 0.9s ease 0.12s forwards;
    }

    .title-kicker,
    .title-main,
    .title-sub {
      display: block;
      overflow: visible;
    }

    .title-kicker,
    .title-sub {
      font-size: clamp(38px, 6.4vw, 82px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.052em;
    }

    .title-main {
      margin: 0.16em 0 0.13em;
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(46px, 7.6vw, 102px);
      font-style: italic;
      font-weight: 800;
      line-height: 1.02;
      letter-spacing: -0.062em;
      color: #fff;
      text-shadow: 0 10px 40px rgba(0, 0, 0, 0.26);
    }

    .title-shine {
      display: inline-block;
    }

    .content p {
      max-width: 720px;
      font-size: clamp(15px, 1.55vw, 20px);
      line-height: 1.5;
      opacity: 0;
      transform: translateY(14px);
      animation: contentReveal 0.9s ease 0.34s forwards;
    }

    .actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-top: 30px;
      opacity: 0;
      transform: translateY(12px);
      animation: contentReveal 0.75s ease 0.95s forwards;
    }

    .button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 24px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.75);
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      letter-spacing: 0.02em;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      cursor: pointer;
      transition: 0.2s ease;
    }

    .button:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: translateY(-1px);
    }

    .button-icon {
      width: 17px;
      height: 17px;
      transition: transform 0.45s ease;
    }

    .button:hover .button-icon {
      transform: rotate(180deg);
    }

    .top-controls {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 6;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      opacity: 0;
      transform: translateY(-10px);
      animation: panelReveal 0.75s ease 0.68s forwards;
    }

    .github-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 11px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      color: rgba(255, 255, 255, 0.88);
      background: rgba(0, 0, 0, 0.24);
      backdrop-filter: blur(12px);
      font-size: 12px;
      font-weight: 800;
      line-height: 1;
      text-decoration: none;
      transition: 0.18s ease;
    }

    .github-link:hover {
      color: #111;
      border-color: rgba(255, 255, 255, 0.9);
      background: rgba(255, 255, 255, 0.9);
      transform: translateY(-1px);
    }

    .github-icon {
      width: 15px;
      height: 15px;
      flex: 0 0 auto;
    }

    .quality-panel {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      width: 238px;
      padding: 9px 10px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.24);
      backdrop-filter: blur(12px);
      text-align: left;
    }

    .quality-title {
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.68;
    }

    .quality-buttons {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .quality-button {
      min-width: 46px;
      padding: 5px 8px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 999px;
      color: rgba(255, 255, 255, 0.88);
      background: rgba(255, 255, 255, 0.06);
      font: inherit;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.18s ease;
    }

    .quality-button:hover,
    .quality-button.active {
      color: #111;
      border-color: rgba(255, 255, 255, 0.9);
      background: rgba(255, 255, 255, 0.9);
    }

    .quality-recommendation {
      max-width: 360px;
      font-size: 11px;
      line-height: 1.25;
      color: rgba(255, 255, 255, 0.72);
    }

    .quality-recommendation-label,
    .quality-recommendation-value {
      display: block;
    }

    .quality-recommendation-label {
      opacity: 0.62;
    }

    .quality-recommendation-value {
      margin-top: 2px;
      color: rgba(255, 255, 255, 0.86);
      font-weight: 700;
    }

    @keyframes contentReveal {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes panelReveal {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }



    @media (prefers-reduced-motion: reduce) {
      .content h1,
      .content p,
      .actions,
      .top-controls {
        animation: none;
      }

      .content h1,
      .content p,
      .actions,
      .top-controls {
        opacity: 1;
        transform: none;
      }
    }

    @media (max-width: 1120px) {
      .content h1 {
        width: min(700px, calc(100vw - 56px));
      }

      .title-kicker,
      .title-sub {
        font-size: clamp(36px, 7.2vw, 68px);
      }

      .title-main {
        font-size: clamp(44px, 8.6vw, 82px);
      }
    }

    @media (max-width: 768px) {
      .hero {
        min-height: 520px;
      }

      .content {
        padding-inline: 20px;
      }

      .content h1 {
        width: 100%;
      }

      .title-kicker,
      .title-sub {
        font-size: clamp(34px, 10vw, 48px);
        letter-spacing: -0.048em;
      }

      .title-main {
        margin: 0.18em 0 0.15em;
        font-size: clamp(40px, 11.5vw, 58px);
        letter-spacing: -0.058em;
      }

      .content p {
        font-size: 15px;
      }

      .top-controls {
        top: 12px;
        right: 12px;
      }

      .quality-panel {
        width: 210px;
        padding: 8px;
      }
    }

    @media (max-width: 480px) {
      .title-kicker,
      .title-sub {
        font-size: clamp(32px, 11vw, 42px);
      }

      .title-main {
        font-size: clamp(38px, 13vw, 50px);
      }
    }
  </style>
</head>

<body class="is-loading">
  <section class="hero">
    <div class="fallback-image-layer" id="fallbackImageLayer"></div>

    <div class="video-stage" id="videoStage">
      <div class="video-layer" id="videoLayerA">
        <video id="bgVideoA" autoplay muted playsinline webkit-playsinline preload="metadata" poster="videos/video_001/segments/poster.jpg" disablepictureinpicture disableremoteplayback x-webkit-airplay="deny"></video>
      </div>
      <div class="video-layer" id="videoLayerB">
        <video id="bgVideoB" autoplay muted playsinline webkit-playsinline preload="metadata" poster="videos/video_001/segments/poster.jpg" disablepictureinpicture disableremoteplayback x-webkit-airplay="deny"></video>
      </div>
    </div>

    <div class="video-cover" id="videoCover"></div>
    <div class="overlay"></div>

    <div class="content">
      <h1 aria-label="HLS Background Video">
        <span class="title-shine">
          <span class="title-kicker">HLS</span>
          <span class="title-main">Background</span>
          <span class="title-sub">Video</span>
        </span>
      </h1>
      <p>
        Streams adaptive HLS segments from a random timeline point, keeps mobile autoplay stable, and crossfades every jump for a cleaner background loop.
      </p>

      <div class="actions">
        <button class="button" id="refreshVideoButton" type="button" aria-label="Start background video from another random moment">
          <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 0 1-15.4 6.4" />
            <path d="M3 12A9 9 0 0 1 18.4 5.6" />
            <path d="M18 2v4h4" />
            <path d="M6 22v-4H2" />
          </svg>
          <span>Randomize Background</span>
        </button>

      </div>
    </div>

    <div class="top-controls">
      <div class="quality-panel" aria-label="Background video quality">
        <div class="quality-title">Stream quality</div>
        <div class="quality-buttons" id="qualityButtons">
          <button class="quality-button active" type="button" data-quality="auto">Auto</button>
          <button class="quality-button" type="button" data-quality="480p">480p</button>
          <button class="quality-button" type="button" data-quality="720p">720p</button>
          <button class="quality-button" type="button" data-quality="1080p">1080p</button>
        </div>
        <div class="quality-recommendation" id="qualityRecommendation">
          <span class="quality-recommendation-label">Recommended now</span>
          <span class="quality-recommendation-value" id="qualityRecommendationValue"></span>
        </div>
      </div>

      <a class="github-link" href="https://github.com/boriskaborisenko/DESIGN_LAB" target="_blank" rel="noopener noreferrer" aria-label="Open project on GitHub">
        <svg class="github-icon" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
          <path d="M12 .5a12 12 0 0 0-3.79 23.39c.6.11.82-.26.82-.58v-2.03c-3.34.73-4.04-1.61-4.04-1.61-.55-1.38-1.33-1.75-1.33-1.75-1.09-.75.08-.73.08-.73 1.2.08 1.84 1.24 1.84 1.24 1.07 1.83 2.8 1.3 3.49.99.11-.78.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.45 11.45 0 0 1 6 0c2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.63-5.48 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.83.58A12 12 0 0 0 12 .5Z" />
        </svg>
        <span>GitHub</span>
      </a>
    </div>
  </section>

  <script>
    const QUALITY_SOURCES = {
      auto: {
        label: "Auto",
        url: "videos/video_001/segments/master.m3u8"
      },
      "480p": {
        label: "480p",
        url: "videos/video_001/segments/480p/index.m3u8"
      },
      "720p": {
        label: "720p",
        url: "videos/video_001/segments/720p/index.m3u8"
      },
      "1080p": {
        label: "1080p",
        url: "videos/video_001/segments/1080p/index.m3u8"
      }
    };

    const POSTER_URL = "videos/video_001/segments/poster.jpg";
    const VIDEO_DURATION_SECONDS = 655.7;
    const RANDOM_END_GUARD_SECONDS = 20;
    const COVER_HIDE_DELAY = 500;
    const CROSSFADE_MS = 1100;
    const HLS_JS_URL = "https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js";

    const fallbackImageLayer = document.getElementById("fallbackImageLayer");
    const pageBody = document.body;
    const videoCover = document.getElementById("videoCover");
    const refreshVideoButton = document.getElementById("refreshVideoButton");
    const qualityButtons = Array.from(document.querySelectorAll("[data-quality]"));
    const qualityRecommendationValue = document.getElementById("qualityRecommendationValue");

    const players = [
      {
        layer: document.getElementById("videoLayerA"),
        video: document.getElementById("bgVideoA"),
        hls: null
      },
      {
        layer: document.getElementById("videoLayerB"),
        video: document.getElementById("bgVideoB"),
        hls: null
      }
    ];

    let activePlayerIndex = 0;
    let isSwitching = false;
    let hlsJsPromise = null;
    let selectedQuality = "auto";

    fallbackImageLayer.style.backgroundImage = `url("${POSTER_URL}")`;

    players.forEach(function (player) {
      configureVideo(player.video);
    });

    updateQualityRecommendation();

    function configureVideo(video) {
      video.controls = false;
      video.muted = true;
      video.defaultMuted = true;
      video.autoplay = true;
      video.loop = false;
      video.playsInline = true;
      video.disablePictureInPicture = true;
      video.setAttribute("muted", "");
      video.setAttribute("playsinline", "");
      video.setAttribute("webkit-playsinline", "");
      video.setAttribute("disablepictureinpicture", "");
      video.setAttribute("disableremoteplayback", "");
      video.setAttribute("x-webkit-airplay", "deny");
    }

    function getSelectedSourceUrl() {
      return QUALITY_SOURCES[selectedQuality].url;
    }

    function getRandomStartTime() {
      const maxStart = Math.max(0, VIDEO_DURATION_SECONDS - RANDOM_END_GUARD_SECONDS);
      return Math.floor(Math.random() * maxStart);
    }

    function getConnectionInfo() {
      return navigator.connection || navigator.mozConnection || navigator.webkitConnection || null;
    }

    function getRecommendedQuality() {
      const connection = getConnectionInfo();
      const width = Math.max(window.innerWidth, window.screen.width || 0);
      const effectiveType = connection && connection.effectiveType ? connection.effectiveType : "unknown";
      const downlink = connection && typeof connection.downlink === "number" ? connection.downlink : null;
      const saveData = Boolean(connection && connection.saveData);

      if (saveData) {
        return {
          quality: "480p",
          reason: "data saver is enabled"
        };
      }

      if (effectiveType === "slow-2g" || effectiveType === "2g" || effectiveType === "3g") {
        return {
          quality: "480p",
          reason: "safer for slower mobile networks"
        };
      }

      if (downlink !== null && downlink < 3.5) {
        return {
          quality: "480p",
          reason: "lighter for the current connection"
        };
      }

      if (width >= 1400 && (downlink === null || downlink >= 8)) {
        return {
          quality: "1080p",
          reason: "best for large screens and fast Wi-Fi"
        };
      }

      return {
        quality: "720p",
        reason: "balanced quality and speed"
      };
    }

    function updateQualityRecommendation() {
      const recommendation = getRecommendedQuality();
      qualityRecommendationValue.textContent = `${recommendation.quality} — ${recommendation.reason}`;
    }

    function updateQualityButtons() {
      qualityButtons.forEach(function (button) {
        button.classList.toggle("active", button.dataset.quality === selectedQuality);
      });
    }

    function revealVideo() {
      pageBody.classList.remove("is-loading");

      window.setTimeout(function () {
        videoCover.classList.add("hidden");
      }, COVER_HIDE_DELAY);
    }

    function hideCoverFallback() {
      window.setTimeout(function () {
        videoCover.classList.add("hidden");
      }, 2500);
    }

    function playVideo(video) {
      video.muted = true;
      video.defaultMuted = true;

      const playPromise = video.play();

      if (playPromise && typeof playPromise.catch === "function") {
        return playPromise.catch(function (error) {
          console.log("Background video autoplay failed:", error);
          hideCoverFallback();
        });
      }

      return Promise.resolve();
    }

    function loadHlsJs() {
      if (hlsJsPromise) {
        return hlsJsPromise;
      }

      hlsJsPromise = new Promise(function (resolve, reject) {
        if (window.Hls) {
          resolve(window.Hls);
          return;
        }

        const script = document.createElement("script");
        script.src = HLS_JS_URL;
        script.async = true;
        script.onload = function () {
          resolve(window.Hls);
        };
        script.onerror = reject;
        document.head.appendChild(script);
      });

      return hlsJsPromise;
    }

    function destroyPlayerSource(player) {
      if (player.hls) {
        player.hls.destroy();
        player.hls = null;
      }

      player.video.pause();
      player.video.removeAttribute("src");
      player.video.load();
    }

    function waitForReady(video) {
      return new Promise(function (resolve) {
        if (video.readyState >= 3) {
          resolve();
          return;
        }

        const done = function () {
          cleanup();
          resolve();
        };

        const cleanup = function () {
          video.removeEventListener("canplay", done);
          video.removeEventListener("playing", done);
          video.removeEventListener("timeupdate", done);
        };

        video.addEventListener("canplay", done, { once: true });
        video.addEventListener("playing", done, { once: true });
        video.addEventListener("timeupdate", done, { once: true });
        window.setTimeout(done, 2500);
      });
    }

    function seekNativeVideo(video, randomStartTime) {
      return new Promise(function (resolve) {
        let resolved = false;

        const done = function () {
          if (resolved) {
            return;
          }

          resolved = true;
          video.removeEventListener("seeked", done);
          video.removeEventListener("canplay", done);
          resolve();
        };

        video.addEventListener("seeked", done, { once: true });
        video.addEventListener("canplay", done, { once: true });

        try {
          video.currentTime = randomStartTime;
        } catch (error) {
          console.log("Random seek failed, starting from the beginning:", error);
          done();
        }

        window.setTimeout(done, 1500);
      });
    }

    function attachSource(player, randomStartTime) {
      const video = player.video;
      const sourceUrl = getSelectedSourceUrl();
      const supportsNativeHls = video.canPlayType("application/vnd.apple.mpegurl") !== "";

      destroyPlayerSource(player);
      configureVideo(video);

      if (supportsNativeHls) {
        video.src = sourceUrl;
        video.load();

        return new Promise(function (resolve) {
          let metadataLoaded = false;

          video.addEventListener("loadedmetadata", function () {
            metadataLoaded = true;
            seekNativeVideo(video, randomStartTime)
              .then(function () {
                return playVideo(video);
              })
              .then(function () {
                return waitForReady(video);
              })
              .then(resolve);
          }, { once: true });

          window.setTimeout(function () {
            if (!metadataLoaded) {
              playVideo(video)
                .then(function () {
                  return waitForReady(video);
                })
                .then(resolve);
            }
          }, 3500);
        });
      }

      return loadHlsJs().then(function () {
        if (!window.Hls || !Hls.isSupported()) {
          console.log("HLS is not supported in this browser. Poster fallback is shown.");
          videoCover.classList.add("hidden");
          return;
        }

        player.hls = new Hls({
          startPosition: randomStartTime,
          capLevelToPlayerSize: true,
          maxBufferLength: 30,
          backBufferLength: 30
        });

        player.hls.loadSource(sourceUrl);
        player.hls.attachMedia(video);

        player.hls.on(Hls.Events.ERROR, function (event, data) {
          console.log("HLS error:", data);

          if (data.fatal && player.hls) {
            player.hls.destroy();
            player.hls = null;
          }
        });

        return new Promise(function (resolve) {
          player.hls.on(Hls.Events.MANIFEST_PARSED, function () {
            playVideo(video)
              .then(function () {
                return waitForReady(video);
              })
              .then(resolve);
          });
        });
      });
    }

    function crossfadeTo(playerIndex) {
      const nextPlayer = players[playerIndex];
      const currentPlayer = players[activePlayerIndex];

      nextPlayer.layer.classList.add("visible");
      currentPlayer.layer.classList.remove("visible");
      activePlayerIndex = playerIndex;
      revealVideo();

      window.setTimeout(function () {
        if (currentPlayer !== nextPlayer) {
          currentPlayer.video.pause();
        }

        isSwitching = false;
      }, CROSSFADE_MS);
    }

    function switchToRandomPoint() {
      if (isSwitching) {
        return;
      }

      isSwitching = true;

      const nextPlayerIndex = activePlayerIndex === 0 ? 1 : 0;
      const randomStartTime = getRandomStartTime();

      attachSource(players[nextPlayerIndex], randomStartTime)
        .then(function () {
          crossfadeTo(nextPlayerIndex);
        })
        .catch(function (error) {
          console.log("Failed to switch background video:", error);
          isSwitching = false;
          hideCoverFallback();
        });
    }

    players.forEach(function (player) {
      player.video.addEventListener("ended", switchToRandomPoint);
      player.video.addEventListener("error", function () {
        console.log("Native video error:", player.video.error);
        hideCoverFallback();
      });
    });

    refreshVideoButton.addEventListener("click", switchToRandomPoint);

    qualityButtons.forEach(function (button) {
      button.addEventListener("click", function () {
        const nextQuality = button.dataset.quality;

        if (!QUALITY_SOURCES[nextQuality] || nextQuality === selectedQuality) {
          return;
        }

        selectedQuality = nextQuality;
        updateQualityButtons();
        switchToRandomPoint();
      });
    });

    window.addEventListener("resize", updateQualityRecommendation);

    const connection = getConnectionInfo();
    if (connection && typeof connection.addEventListener === "function") {
      connection.addEventListener("change", updateQualityRecommendation);
    }

    attachSource(players[activePlayerIndex], getRandomStartTime())
      .then(function () {
        players[activePlayerIndex].layer.classList.add("visible");
        revealVideo();
      })
      .catch(function (error) {
        console.log("Failed to start background video:", error);
        hideCoverFallback();
      });
  </script>
</body>
</html>
