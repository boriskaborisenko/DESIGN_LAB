<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>HLS Background Video</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&family=Playfair+Display:ital,wght@1,700;1,800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #000;
      font-family: "Inter", Arial, Helvetica, sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 560px;
      overflow: hidden;
      background: #000;
      color: #fff;
    }

    .fallback-image-layer,
    .video-layer,
    .video-cover,
    .overlay {
      position: absolute;
      inset: 0;
    }

    .fallback-image-layer {
      z-index: 1;
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      background-color: #111;
    }

    .video-layer {
      z-index: 2;
      overflow: hidden;
      background: #000;
      opacity: 0;
      transition: opacity 0.9s ease;
    }

    .video-layer.visible {
      opacity: 1;
    }

    .video-layer video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .video-layer video::-webkit-media-controls,
    .video-layer video::-webkit-media-controls-panel,
    .video-layer video::-webkit-media-controls-play-button,
    .video-layer video::-webkit-media-controls-start-playback-button {
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    .video-cover {
      z-index: 3;
      background:
        radial-gradient(circle at center, rgba(255, 255, 255, 0.08), transparent 40%),
        linear-gradient(135deg, #111, #222);
      opacity: 1;
      pointer-events: none;
      transition: opacity 0.9s ease;
    }

    .video-cover.hidden {
      opacity: 0;
    }

    .overlay {
      z-index: 4;
      background: linear-gradient(rgba(0, 0, 0, 0.42), rgba(0, 0, 0, 0.58));
    }

    .content {
      position: relative;
      z-index: 5;
      width: 100%;
      height: 100%;
      padding: 24px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;
    }

    .content h1 {
      max-width: 900px;
      font-size: clamp(38px, 6.8vw, 94px);
      font-weight: 900;
      line-height: 0.9;
      letter-spacing: -0.065em;
      margin-bottom: 24px;
    }

    .content h1 .accent-word {
      display: inline-block;
      font-family: "Playfair Display", Georgia, serif;
      font-style: italic;
      font-weight: 800;
      letter-spacing: -0.08em;
      transform: translateY(0.04em);
    }

    .content p {
      max-width: 720px;
      font-size: clamp(15px, 1.55vw, 20px);
      line-height: 1.5;
      opacity: 0.92;
    }

    .button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 34px;
      padding: 14px 24px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.75);
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      letter-spacing: 0.02em;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      cursor: pointer;
      transition: 0.2s ease;
    }

    .button:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: translateY(-1px);
    }

    .button-icon {
      width: 17px;
      height: 17px;
      transition: transform 0.45s ease;
    }

    .button:hover .button-icon {
      transform: rotate(180deg);
    }

    @media (max-width: 768px) {
      .hero {
        min-height: 520px;
      }

      .content h1 {
        font-size: 46px;
      }

      .content p {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <section class="hero">
    <div class="fallback-image-layer" id="fallbackImageLayer"></div>

    <div class="video-layer" id="videoLayer">
      <video
        id="bgVideo"
        autoplay
        muted
        playsinline
        webkit-playsinline
        preload="metadata"
        poster="videos/video_001/segments/poster.jpg"
        disablepictureinpicture
        disableremoteplayback
        x-webkit-airplay="deny"
      ></video>
    </div>

    <div class="video-cover" id="videoCover"></div>
    <div class="overlay"></div>

    <div class="content">
      <h1>HLS <span class="accent-word">Background</span> Video</h1>
      <p>
        Streams lightweight HLS segments from a random timeline point, keeps mobile autoplay stable, and falls back to a poster when needed.
      </p>
      <button class="button" id="refreshVideoButton" type="button" aria-label="Start background video from another random moment">
        <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 0 1-15.4 6.4" />
          <path d="M3 12A9 9 0 0 1 18.4 5.6" />
          <path d="M18 2v4h4" />
          <path d="M6 22v-4H2" />
        </svg>
        <span>Randomize Background</span>
      </button>
    </div>
  </section>

  <script>
    const HLS_URL = "videos/video_001/segments/index.m3u8";
    const POSTER_URL = "videos/video_001/segments/poster.jpg";
    const VIDEO_DURATION_SECONDS = 655.7;
    const RANDOM_END_GUARD_SECONDS = 20;
    const COVER_HIDE_DELAY = 500;
    const HLS_JS_URL = "https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js";

    const video = document.getElementById("bgVideo");
    const videoLayer = document.getElementById("videoLayer");
    const videoCover = document.getElementById("videoCover");
    const fallbackImageLayer = document.getElementById("fallbackImageLayer");
    const refreshVideoButton = document.getElementById("refreshVideoButton");

    fallbackImageLayer.style.backgroundImage = `url("${POSTER_URL}")`;

    video.controls = false;
    video.muted = true;
    video.defaultMuted = true;
    video.autoplay = true;
    video.loop = false;
    video.playsInline = true;
    video.disablePictureInPicture = true;
    video.setAttribute("muted", "");
    video.setAttribute("playsinline", "");
    video.setAttribute("webkit-playsinline", "");
    video.setAttribute("disablepictureinpicture", "");
    video.setAttribute("disableremoteplayback", "");
    video.setAttribute("x-webkit-airplay", "deny");

    function getRandomStartTime() {
      const maxStart = Math.max(0, VIDEO_DURATION_SECONDS - RANDOM_END_GUARD_SECONDS);
      return Math.floor(Math.random() * maxStart);
    }

    function revealVideo() {
      videoLayer.classList.add("visible");

      window.setTimeout(function () {
        videoCover.classList.add("hidden");
      }, COVER_HIDE_DELAY);
    }

    function hideCoverFallback() {
      window.setTimeout(function () {
        videoCover.classList.add("hidden");
      }, 2500);
    }

    function playVideo() {
      video.muted = true;
      video.defaultMuted = true;

      const playPromise = video.play();

      if (playPromise && typeof playPromise.catch === "function") {
        playPromise.catch(function (error) {
          console.log("Background video autoplay failed:", error);
          hideCoverFallback();
        });
      }
    }

    function seekAndPlay(randomStartTime) {
      let playbackRequested = false;

      function requestPlayback() {
        if (playbackRequested) {
          return;
        }

        playbackRequested = true;
        playVideo();
      }

      video.addEventListener("seeked", requestPlayback, { once: true });
      video.addEventListener("canplay", requestPlayback, { once: true });

      try {
        video.currentTime = randomStartTime;
      } catch (error) {
        console.log("Random seek failed, starting from the beginning:", error);
        requestPlayback();
      }

      window.setTimeout(requestPlayback, 1200);
    }

    function startNativeHls(randomStartTime) {
      let metadataLoaded = false;

      video.src = HLS_URL;
      video.load();

      video.addEventListener("loadedmetadata", function () {
        metadataLoaded = true;
        seekAndPlay(randomStartTime);
      }, { once: true });

      window.setTimeout(function () {
        if (!metadataLoaded) {
          playVideo();
          hideCoverFallback();
        }
      }, 3500);
    }

    function loadHlsJs() {
      return new Promise(function (resolve, reject) {
        if (window.Hls) {
          resolve(window.Hls);
          return;
        }

        const script = document.createElement("script");
        script.src = HLS_JS_URL;
        script.async = true;
        script.onload = function () {
          resolve(window.Hls);
        };
        script.onerror = reject;
        document.head.appendChild(script);
      });
    }

    function startHlsJs(randomStartTime) {
      const hls = new Hls({
        startPosition: randomStartTime,
        capLevelToPlayerSize: true,
        maxBufferLength: 30,
        backBufferLength: 30
      });

      hls.loadSource(HLS_URL);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, function () {
        playVideo();
      });

      hls.on(Hls.Events.ERROR, function (event, data) {
        console.log("HLS error:", data);

        if (data.fatal) {
          hls.destroy();
        }
      });
    }

    video.addEventListener("playing", revealVideo, { once: true });
    video.addEventListener("timeupdate", revealVideo, { once: true });
    video.addEventListener("ended", function () {
      seekAndPlay(getRandomStartTime());
    });

    refreshVideoButton.addEventListener("click", function () {
      seekAndPlay(getRandomStartTime());
    });
    video.addEventListener("error", function () {
      console.log("Native video error:", video.error);
      hideCoverFallback();
    });

    const randomStartTime = getRandomStartTime();
    const supportsNativeHls = video.canPlayType("application/vnd.apple.mpegurl") !== "";

    if (supportsNativeHls) {
      startNativeHls(randomStartTime);
    } else {
      loadHlsJs()
        .then(function () {
          if (window.Hls && Hls.isSupported()) {
            startHlsJs(randomStartTime);
          } else {
            console.log("HLS is not supported in this browser. Poster fallback is shown.");
            videoCover.classList.add("hidden");
          }
        })
        .catch(function (error) {
          console.log("Failed to load hls.js:", error);
          videoCover.classList.add("hidden");
        });
    }
  </script>
</body>
</html>
